name: Bootstrap SUS3021 Study source

on:
  push:
    branches: [ "main" ]
    paths:
      - ".bootstrap/project.b64"
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct project archive
        shell: bash
        run: |
          base64 --decode .bootstrap/project.b64 > /tmp/SUS3021Study_GitHubReady.zip
          mkdir -p /tmp/sus3021-import
          unzip -q /tmp/SUS3021Study_GitHubReady.zip -d /tmp/sus3021-import
          test -d /tmp/sus3021-import/SUS3021Study_GitHubReady

      - name: Import project source without workflow files
        shell: bash
        run: |
          rsync -a --exclude='.github/workflows/android-build.yml' /tmp/sus3021-import/SUS3021Study_GitHubReady/ ./
          rm -rf .bootstrap

      - name: Commit imported source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Import SUS3021 Study v0.8 source"
          git push origin HEAD:main
